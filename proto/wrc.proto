syntax = "proto3";

package browserscale.v1;

option go_package = "github.com/browserscale/browserscale-go/generated";

import "google/protobuf/empty.proto";

// ──────────────────────────────────────────────────────────────────────
// Service
// ──────────────────────────────────────────────────────────────────────
//
// Every RPC carries `session_id` + `api_key` for authentication. The
// session implicitly identifies the browser context that was created at
// rent time, so the WRC.pdl `browserContextId` / `contextId` parameters
// are not exposed on the wire (server resolves them from session_id).
//
// `page_id` stays as an explicit parameter, mirroring WRC.pdl exactly:
// one browser context can host multiple pages (tabs/popups).

service Browser {
  // Context-level
  rpc SetProxy(SetProxyRequest) returns (google.protobuf.Empty);
  rpc GetPages(GetPagesRequest) returns (GetPagesResponse);

  // Page navigation / content
  rpc Navigate(NavigateRequest) returns (NavigateResponse);
  rpc LoadHTML(LoadHTMLRequest) returns (google.protobuf.Empty);

  // Evaluation
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
  rpc Run(RunRequest) returns (RunResponse);

  // Waiting
  rpc WaitForAny(WaitForAnyParams) returns (WaitResult);

  // Element actions
  rpc SelectOption(SelectOptionRequest) returns (SelectOptionResult);
  rpc ScrollTo(ScrollToRequest) returns (ScrollResult);
  rpc MoveTo(MoveToRequest) returns (MoveResult);
  rpc Click(ClickRequest) returns (ClickResult);
  rpc Drag(DragRequest) returns (DragResult);
  rpc Fill(FillRequest) returns (FillResult);

  // Reactions — one-shot background auto-click when a condition matches. A
  // shared per-page poller fires only while the pointer is idle, so a reaction
  // slots into the gaps of a retrying foreground action.
  rpc AddReaction(AddReactionRequest) returns (AddReactionResponse);
  rpc RemoveReaction(RemoveReactionRequest) returns (RemoveReactionResponse);
  rpc ListReactions(ListReactionsRequest) returns (ListReactionsResponse);

  // Network interception
  rpc SetBlockList(SetBlockListRequest) returns (google.protobuf.Empty);
  rpc SetStaticPaths(SetStaticPathsRequest) returns (google.protobuf.Empty);
  rpc WaitForAnyRequest(WaitForAnyRequestRequest) returns (WaitForAnyRequestResponse);
  rpc WaitForAnyResponse(WaitForAnyResponseRequest) returns (WaitForAnyResponseResponse);
  rpc ModifyRequest(ModifyRequestRequest) returns (ModifyRequestResponse);

  // Network capture — every matching request in the session, reported as it
  // completes. Start/Stop are session state; the stream is a separate
  // subscription, so a capture survives a reader reconnect and two readers
  // can watch one capture.
  rpc StartNetworkCapture(StartNetworkCaptureRequest) returns (google.protobuf.Empty);
  rpc StopNetworkCapture(StopNetworkCaptureRequest) returns (StopNetworkCaptureResponse);
  rpc StreamNetworkExchanges(StreamNetworkExchangesRequest) returns (stream NetworkExchangeEvent);

  // Cookies
  rpc GetCookies(GetCookiesRequest) returns (GetCookiesResponse);
  rpc SetCookies(SetCookiesRequest) returns (google.protobuf.Empty);
  rpc ClearCookies(ClearCookiesRequest) returns (google.protobuf.Empty);

  // Storage (localStorage)
  rpc GetStorage(GetStorageRequest) returns (GetStorageResponse);
  rpc SetStorage(SetStorageRequest) returns (google.protobuf.Empty);
  rpc ClearStorage(ClearStorageRequest) returns (google.protobuf.Empty);

  // Auth / DBSC (portable signed-in persona)
  rpc GetAuthSession(GetAuthSessionRequest) returns (GetAuthSessionResponse);
  rpc SetAuthSession(SetAuthSessionRequest) returns (google.protobuf.Empty);

  // DOM / observation
  rpc GetDOM(GetDOMRequest) returns (GetDOMResponse);
  rpc GetDOMHash(GetDOMHashRequest) returns (GetDOMHashResponse);
  rpc GetObservation(GetObservationRequest) returns (GetObservationResponse);
  rpc InspectAtPosition(InspectAtPositionRequest) returns (InspectAtPositionResponse);
  rpc HighlightNode(HighlightNodeRequest) returns (google.protobuf.Empty);

  // DOM mirror — an incremental view of the page's DOM, as ONE tree.
  // StartDomMirror returns the top of the main document and from then on the
  // browser reports changes to the part the client has actually expanded; the
  // reads grow and shrink that part. Together they replace polling GetDOMHash
  // and re-fetching GetDOM.
  //
  // An <iframe> is an ordinary element whose one child is the document it
  // hosts, fetched by expanding it — which is also what starts mirroring that
  // frame, so frames cost nothing until someone opens one. There is no frame
  // lifecycle to subscribe to. RevealDomNode reaches into a frame nobody
  // opened and starts the ones on the way, which is what makes a hit test
  // usable against a lazily loaded tree.
  //
  // Like network capture, the stream is a separate subscription so a mirror
  // survives a reader reconnect. Unlike it, the stream carries both updates
  // and resyncs on ONE channel: a resync means "everything you hold is void",
  // which is only interpretable in order against the batches around it.
  rpc StartDomMirror(StartDomMirrorRequest) returns (StartDomMirrorResponse);
  rpc StopDomMirror(StopDomMirrorRequest) returns (google.protobuf.Empty);
  rpc GetDomChildren(GetDomChildrenRequest) returns (GetDomChildrenResponse);
  rpc ReleaseDomSubtree(ReleaseDomSubtreeRequest) returns (google.protobuf.Empty);
  rpc RevealDomNode(RevealDomNodeRequest) returns (RevealDomNodeResponse);
  rpc GetDomRevision(GetDomRevisionRequest) returns (GetDomRevisionResponse);
  rpc StreamDomEvents(StreamDomEventsRequest) returns (stream DomEvent);

  // Screenshot / capture
  rpc Screenshot(ScreenshotRequest) returns (ScreenshotResponse);
  rpc ReadCanvas(ReadCanvasRequest) returns (ReadCanvasResponse);

  // Keyboard / IME (used by the live browser UI on top of the WebRTC stream)
  rpc InsertText(InsertTextRequest) returns (google.protobuf.Empty);
  rpc Type(TypeRequest) returns (google.protobuf.Empty);
  rpc PressKey(PressKeyRequest) returns (google.protobuf.Empty);
  rpc ReleaseKey(ReleaseKeyRequest) returns (google.protobuf.Empty);
  rpc GetSelection(GetSelectionRequest) returns (GetSelectionResponse);

  // Captcha solver
  rpc SolveCaptcha(SolveCaptchaRequest) returns (SolveCaptchaResponse);

  // Live streaming (WebRTC). The page is streamed as a video track over a
  // WebRTC PeerConnection whose media is relayed through the TURN server. The
  // caller creates the offer (client-offerer); the browser answers it.
  // GetStreamConfig first hands out the ICE servers the client needs to build
  // that offer.
  rpc GetStreamConfig(GetStreamConfigRequest) returns (GetStreamConfigResponse);
  rpc StartStream(StartStreamRequest) returns (StartStreamResponse);
  rpc StopStream(StopStreamRequest) returns (StopStreamResponse);

  // Scripts — automation that runs inside the browser process rather than
  // across the network. The script gets the same `browser.*` surface this
  // service exposes, but each call is a function call in the browser instead of
  // a gRPC round trip, so a loop that is unusable at ~50ms per step costs
  // microseconds. Worth it for anything chatty: waiting for a selector,
  // scraping a list, walking pagination.
  //
  // Two modes, because a script is either something you wait for or something
  // you leave running. RunScript blocks and hands back the return value with
  // the whole log, which is what a one-shot caller wants. StartScript returns a
  // run id immediately and the output arrives on the event stream, which is the
  // only workable shape for a script that outlives the request.
  //
  // Like network capture the stream is a separate subscription, so output
  // survives a reader reconnect and two readers can watch one run.
  rpc RunScript(RunScriptRequest) returns (RunScriptResponse);
  rpc StartScript(StartScriptRequest) returns (StartScriptResponse);
  rpc StopScripts(StopScriptsRequest) returns (StopScriptsResponse);
  rpc ListScriptRuns(ListScriptRunsRequest) returns (ListScriptRunsResponse);
  rpc StreamScriptEvents(StreamScriptEventsRequest) returns (stream ScriptEvent);
}

// ──────────────────────────────────────────────────────────────────────
// Common types
// ──────────────────────────────────────────────────────────────────────

message Rect {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}

message FrameInfo {
  string frame_id = 1;
  string url = 2;
  bool is_oopif = 3;
  bool has_js_context = 4;
  bool is_loading = 5;
  bool is_visible = 6;
  Rect absolute_rect = 7;
  Rect relative_rect = 8;
  repeated FrameInfo children = 9;
}

message PageInfo {
  string page_id = 1;
  string browser_context_id = 2;
  string url = 3;
  string title = 4;
  Rect viewport = 5;
  FrameInfo frame_tree = 6;
}

message Header {
  string name = 1;
  string value = 2;
}

message InterceptedRequest {
  string method = 1;
  string url = 2;
  repeated Header headers = 3;
  string body = 4;
  string resource_type = 5;
}

message InterceptedResponse {
  string url = 1;
  int32 status_code = 2;
  repeated Header headers = 3;
  string body = 4;
}

message HeaderModification {
  string name = 1;
  optional string value = 2;
  // "add" | "edit" | "remove"
  string action = 3;
  optional string before = 4;
  optional string after = 5;
}

message CookiePartitionKey {
  string top_level_site = 1;
  bool has_cross_site_ancestor = 2;
}

message CookieParam {
  string name = 1;
  string value = 2;
  optional string url = 3;
  string domain = 4;
  string path = 5;
  optional bool secure = 6;
  optional bool http_only = 7;
  optional string same_site = 8;
  optional double expires = 9;
  optional string priority = 10;
  optional string source_scheme = 11;
  optional int32 source_port = 12;
  optional CookiePartitionKey partition_key = 13;
}

// ──────────────────────────────────────────────────────────────────────
// Waiting
// ──────────────────────────────────────────────────────────────────────

// Exactly one of `selector` or `js_expression` must be set per condition.
message WaitCondition {
  optional string selector = 1;
  optional string js_expression = 2;
  optional bool visible = 3;
  optional double steady_time = 4;
}

message WaitResult {
  int32 index = 1;
  string frame_id = 2;
  int32 backend_node_id = 3;
  bool is_visible = 4;
  Rect bounds = 5;
  // Present iff no condition matched before the deadline (index is -1): the
  // per-condition breakdown of why nothing matched. A timeout is a normal
  // result, not an RPC error.
  optional WaitError error = 6;
}

// Per-condition diagnostic status returned inside WaitError when WaitForAny
// times out; one entry per input condition, in the same order.
message WaitConditionStatus {
  int32 index = 1;
  // "not_found" | "found_hidden" | "found_occluded" | "pending_steady".
  string state = 2;
  int32 backend_node_id = 3;
  string frame_id = 4;
  bool is_visible = 5;
  optional Rect bounds = 6;
  // The intercepting element, present iff state == "found_occluded".
  optional OccluderInfo occluder = 7;
}

// Error detail for WaitForAny. Present in WaitResult iff no condition matched
// before the deadline. Same per-command WRCError<Command> convention as
// ClickError, plus a per-condition breakdown.
message WaitError {
  // Machine-stable failure code. Currently always "timeout".
  string code = 1;
  string message = 2;
  // Per-condition status, same order/length as the input conditions.
  repeated WaitConditionStatus conditions = 3;
}

// ──────────────────────────────────────────────────────────────────────
// Element action results
// ──────────────────────────────────────────────────────────────────────

message ElementResult {
  bool success = 1;
  string frame_id = 2;
  int32 backend_node_id = 3;
  bool is_visible = 4;
  Rect bounds = 5;
  double root_x = 6;
  double root_y = 7;
}

// Describes the element that intercepted a click — the element sitting on top
// of the target at the intended click point. Coordinates are root-viewport CSS
// pixels, consistent with ClickResult.bounds.
message OccluderInfo {
  int32 backend_node_id = 1;
  string frame_id = 2;
  string tag_name = 3;
  optional string id = 4;
  optional string class_name = 5;
  optional string text = 6;
  Rect bounds = 7;
  // Computed pointer-events keyword (e.g. "auto", "none", "all"). Lets the
  // caller tell an invisible pass-through layer from one that genuinely
  // swallows clicks.
  optional string pointer_events = 8;
  // Computed visibility keyword ("visible", "hidden", "collapse").
  optional string visibility = 9;
  // Computed opacity (0..1). 0 means visually invisible but may still
  // intercept clicks depending on pointer_events.
  optional double opacity = 10;
  // Computed effective z-index as a string ("0" when auto/not stacked).
  optional string z_index = 11;
  // True when this element can intercept clicks even while invisible (computed
  // pointer-events in {all, painted, fill, stroke}); i.e. a real click here is
  // swallowed even at visibility:hidden / opacity:0. When false and invisible,
  // a real click would fall through.
  optional bool hittable_while_invisible = 12;
  // Computed position keyword. Reports "fixed"/"sticky" when the element is
  // pinned by itself or by an ancestor — pinned blockers stay put no matter
  // where the pointer goes and can only be cleared by scrolling the target out
  // from under them; ordinary overlays often collapse once the pointer leaves.
  optional string position = 13;
}

// Error detail for a Click that did not land. Present in ClickResult iff
// success is false. First instance of the per-command WRCError<Command>
// convention; other commands migrate to the same shape later.
message ClickError {
  // Machine-stable failure code, e.g. "occluded_no_reachable_point" or
  // "occluded_after_evade".
  string code = 1;
  string message = 2;
  // The intercepting element (present for occlusion codes).
  optional OccluderInfo occluder = 3;
  // Whether a pointer reposition/evade was attempted before giving up.
  optional bool evade_attempted = 4;
}

// ClickResult mirrors ElementResult (field numbers 1-7 kept identical, so it is
// wire-compatible) plus an optional error describing why the click did not land
// when success is false. A failed click is a normal response, not an RPC error.
message ClickResult {
  bool success = 1;
  string frame_id = 2;
  int32 backend_node_id = 3;
  bool is_visible = 4;
  Rect bounds = 5;
  double root_x = 6;
  double root_y = 7;
  optional ClickError error = 8;
}

// ──────────────────────────────────────────────────────────────────────
// Reactions
// ──────────────────────────────────────────────────────────────────────

// ReactionInfo (WRC.pdl ReactionInfo) describes a still-pending reaction as
// returned by ListReactions. One-shot reactions that already fired are gone.
message ReactionInfo {
  // Stable id assigned by AddReaction; pass to RemoveReaction.
  string reaction_id = 1;
  // The match's CSS selector, if it matches by selector.
  optional string match_selector = 2;
  // The match's JS expression, if it matches by expression.
  optional string match_js_expression = 3;
  // Click-target selector, if the action targets a different element.
  optional string action_selector = 4;
  // Click-target JS expression, if the action targets a different element.
  optional string action_js_expression = 5;
  // Frame scope: a specific frameId, empty for the main frame, or "ALL_FRAMES".
  string frame_id = 6;
  // Whether the match additionally requires the element to be visible.
  bool visible = 7;
}

message AddReactionRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;

  // Exactly one of match_selector / match_js_expression must be set.
  optional string match_selector = 4;
  optional string match_js_expression = 5;
  // Where to watch: a specific frameId, empty/omitted for the main frame, or
  // "ALL_FRAMES" to watch every frame.
  optional string frame_id = 6;
  // Require the matched element to be visible before firing.
  optional bool visible = 7;
  // Optional click-target CSS selector, resolved in the matched element's
  // frame. Omitted → click the matched element itself.
  optional string action_selector = 8;
  // Optional click-target JS expression (mutually exclusive with
  // action_selector).
  optional string action_js_expression = 9;
  // "left" (default), "right", or "middle".
  optional string button = 10;
  // 1 = single click (default), 2 = double click.
  optional int32 click_count = 11;
  // Poll cadence in ms for the shared page loop. Default 300.
  optional double interval = 12;
}

message AddReactionResponse {
  // Id of the registered reaction (pass to RemoveReaction).
  string reaction_id = 1;
}

message RemoveReactionRequest {
  string session_id = 1;
  string api_key = 2;
  // Id returned by AddReaction.
  string reaction_id = 3;
}

message RemoveReactionResponse {
  // True if a pending reaction with this id existed and was removed.
  bool removed = 1;
}

message ListReactionsRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
}

message ListReactionsResponse {
  repeated ReactionInfo reactions = 1;
}

// Error detail for a Fill that did not complete. Present in FillResult iff
// success is false. Fill focuses the field with the exact same smart click as
// Click, so any pre-typing failure is a click failure: code/message mirror it
// and the full click diagnostics are nested under click_error.
// ElementRef is a lightweight descriptor of an element — enough for an agent to
// identify it (and decide what to do) without another DOM round-trip. Used to
// name the element that stole focus in a fill focus-loss failure.
message ElementRef {
  int32 backend_node_id = 1;
  // Upper-case tag name, e.g. "INPUT", "BUTTON", "DIV".
  string tag_name = 2;
  optional string id = 3;
  optional string name = 4;
  optional string class_name = 5;
  // <input> type, if the element is an <input>.
  optional string input_type = 6;
  // Whitespace-collapsed textContent/value snippet (max 120 chars).
  optional string text = 7;
  // Whether this element is itself an editable text sink (input/textarea/
  // contenteditable).
  bool editable = 8;
}

message FillError {
  // "not_found", "occluded_no_reachable_point", "occluded_after_evade"
  // (mirrored from the underlying focus click; diagnostics under click_error),
  // "focus_stolen" (another element took focus; focused_element names it) or
  // "focus_lost" (focus left the target and nothing is focused).
  string code = 1;
  string message = 2;
  // The underlying click-core failure that prevented focusing/typing. Present
  // for the click-phase codes; absent for "focus_stolen"/"focus_lost".
  optional ClickError click_error = 3;
  // For "focus_stolen"/"focus_lost": backendNodeId that held focus when fill
  // gave up (0 if nothing was focused). Diagnostic only.
  optional int32 focused_backend_node_id = 4;
  // For "focus_stolen": full descriptor of the element that holds focus
  // instead of the target, so the agent can act on it.
  optional ElementRef focused_element = 5;
  // The fill target's own state at the point of failure: whether it is still an
  // editable text sink, and its current text length. Present for the focus_*
  // codes; lets the agent tell "field vanished/readonly" from "focus stolen".
  optional bool target_editable = 6;
  optional int32 target_value_length = 7;
}

// FillResult mirrors the fill return: the success payload plus an optional error
// when the field could not be focused/typed. Field numbers 1-3/6-7 match
// ElementResult so it stays wire-compatible; is_visible/bounds are not part of
// fill's contract.
message FillResult {
  bool success = 1;
  string frame_id = 2;
  int32 backend_node_id = 3;
  double root_x = 6;
  double root_y = 7;
  optional FillError error = 8;
}

message DragResult {
  bool success = 1;
  string frame_id = 2;
  int32 backend_node_id = 3;
  double start_x = 4;
  double start_y = 5;
  double end_x = 6;
  double end_y = 7;
  optional DragError error = 8;
}

// Error detail for a Drag whose source pickup failed. Present in DragResult iff
// success is false. Drag acquires+presses the source with the same smart click
// as Click, so a pre-drag failure is a click failure: code/message mirror it
// and the full click diagnostics are nested under click_error.
message DragError {
  string code = 1;
  string message = 2;
  optional ClickError click_error = 3;
}

message SelectOptionResult {
  int32 selected_index = 1;
  string selected_value = 2;
  string selected_text = 3;
  bool success = 4;
  optional SelectOptionError error = 5;
}

// Error detail for a SelectOption that failed. Present iff success is false.
// selectOption is programmatic (no pointer gate), so it only reports semantic
// failures.
message SelectOptionError {
  // "not_found" (the <select> was not located) or "option_not_found" (no option
  // matched the requested index/value/text).
  string code = 1;
  string message = 2;
}

// ScrollResult mirrors the scrollTo return: the success payload plus an optional
// error when the target could not be located/scrolled. Field numbers 1-5 match
// ElementResult so it stays wire-compatible; scrollTo returns no root_x/root_y.
message ScrollResult {
  bool success = 1;
  string frame_id = 2;
  int32 backend_node_id = 3;
  bool is_visible = 4;
  Rect bounds = 5;
  optional ScrollError error = 8;
}

// Error detail for a ScrollTo that failed. Present iff success is false; the
// only semantic failure is the target not being locatable/scrollable.
message ScrollError {
  // Currently always "not_found".
  string code = 1;
  string message = 2;
}

// MoveResult mirrors the moveTo return: the success payload plus an optional
// error when the target could not be located. Field numbers 1-7 match
// ElementResult so it stays wire-compatible.
message MoveResult {
  bool success = 1;
  string frame_id = 2;
  int32 backend_node_id = 3;
  bool is_visible = 4;
  Rect bounds = 5;
  double root_x = 6;
  double root_y = 7;
  optional MoveError error = 8;
}

// Error detail for a MoveTo that failed. Present iff success is false; a move
// has no occlusion notion, so the only failure is the target not being
// locatable.
message MoveError {
  // Currently always "not_found".
  string code = 1;
  string message = 2;
}

// ──────────────────────────────────────────────────────────────────────
// Context-level RPCs
// ──────────────────────────────────────────────────────────────────────

message SetProxyRequest {
  string session_id = 1;
  string api_key = 2;
  // Empty/omitted = clear the proxy.
  optional string proxy_host = 3;
  optional int32 proxy_port = 4;
  optional string proxy_username = 5;
  optional string proxy_password = 6;
}

message GetPagesRequest {
  string session_id = 1;
  string api_key = 2;
}

message GetPagesResponse {
  repeated PageInfo pages = 1;
}

// ──────────────────────────────────────────────────────────────────────
// Page navigation / content
// ──────────────────────────────────────────────────────────────────────

message NavigateRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  string url = 4;
  optional string referrer = 5;
  optional double timeout = 6;
}

message NavigateResponse {
  string frame_id = 1;
  string url = 2;
}

message LoadHTMLRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  string url = 4;
  string html = 5;
  repeated Header headers = 6;
  optional int32 status_code = 7;
}

// ──────────────────────────────────────────────────────────────────────
// Evaluation
// ──────────────────────────────────────────────────────────────────────

message EvaluateRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  string expression = 4;
  // Specific frameId or empty/omitted for main frame.
  // ALL_FRAMES is not supported here.
  optional string frame_id = 5;
}

message EvaluateResponse {
  // JSON-serialized result. Empty for DOM elements or unserializable values.
  string result = 1;
  // Non-zero if the expression returned a DOM element.
  int32 backend_node_id = 2;
  bool is_visible = 3;
  Rect bounds = 4;
}

// Run executes a JavaScript automation script inside the God-VM — a bare V8
// isolate that lives outside every renderer.
message RunRequest {
  string session_id = 1;
  string api_key = 2;
  // JavaScript source to execute in the God-VM.
  string source = 3;
  // Page the script should be able to drive (reserved; frame bridge wired in a
  // follow-up). Optional for now — ignored server-side.
  optional string page_id = 4;
}

message RunResponse {
  // False if compilation or execution threw; then `result` holds the message.
  bool success = 1;
  // JSON-serialized result value (or "undefined"), or the error message.
  string result = 2;
}

// ──────────────────────────────────────────────────────────────────────
// Waiting
// ──────────────────────────────────────────────────────────────────────

// Note: named "WaitForAnyParams" instead of "WaitForAnyRequest" to avoid
// colliding with the rpc method name "WaitForAnyRequest" (network intercept).
message WaitForAnyParams {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  repeated WaitCondition conditions = 4;
  // Specific frameId, empty/omitted for main frame, or "ALL_FRAMES".
  optional string frame_id = 5;
  optional double timeout = 6;
}

// ──────────────────────────────────────────────────────────────────────
// Element actions (click, fill, select, scroll, move, drag)
// ──────────────────────────────────────────────────────────────────────

message SelectOptionRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;

  optional int32 backend_node_id = 4;
  optional string selector = 5;
  optional string js_expression = 6;
  // Specific frameId, empty/omitted for main frame, or "ALL_FRAMES".
  optional string frame_id = 7;

  // Exactly one of index / value / text must be set.
  optional int32 index = 8;
  optional string value = 9;
  optional string text = 10;

  // Fire input + change events. Default true.
  optional bool fire_events = 11;
}

message ScrollToRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;

  optional int32 backend_node_id = 4;
  optional string selector = 5;
  optional string js_expression = 6;
  optional string frame_id = 7;
}

message MoveToRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;

  optional int32 backend_node_id = 4;
  optional string selector = 5;
  optional string js_expression = 6;
  optional string frame_id = 7;

  // Use instead of element locators.
  optional double x = 8;
  optional double y = 9;
}

message ClickRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;

  optional int32 backend_node_id = 4;
  optional string selector = 5;
  optional string js_expression = 6;
  optional string frame_id = 7;

  // "left" (default), "right", or "middle".
  optional string button = 8;
  // 1 = single click (default), 2 = double click.
  optional int32 click_count = 9;
  // Use instead of element locators.
  optional double x = 10;
  optional double y = 11;
  // "click" (default), "press" (mouseDown only), "release" (mouseUp only).
  optional string action = 12;
}

message DragRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;

  optional int32 backend_node_id = 4;
  optional string selector = 5;
  optional string js_expression = 6;
  optional string frame_id = 7;

  // Offset from pickup point OR absolute root-viewport coordinates.
  optional double offset_x = 8;
  optional double offset_y = 9;
  optional double absolute_x = 10;
  optional double absolute_y = 11;
}

message FillRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;

  optional int32 backend_node_id = 4;
  optional string selector = 5;
  optional string js_expression = 6;
  optional string frame_id = 7;

  string text = 8;
  // Clear existing content (Ctrl+A, Delete) before typing. Default false,
  // so Fill appends to whatever is already in the field unless this is set.
  optional bool clear_first = 9;
  // Budget in ms to make the field focusable+clickable before giving up
  // (locate, scroll, settle, un-occlude); mirrors Click's timeout. Omit for
  // the server default (5000). 0 = one-shot (no retry).
  optional double timeout = 10;
  // Settle window in ms before the focus click; mirrors Click's steady_time.
  // Omit for the server default (750). 0 skips settling.
  optional double steady_time = 11;
}

// ──────────────────────────────────────────────────────────────────────
// Network interception
// ──────────────────────────────────────────────────────────────────────

message SetBlockListRequest {
  string session_id = 1;
  string api_key = 2;
  // URL wildcard patterns to block. Empty list clears the blocklist.
  repeated string patterns = 3;
}

message SetStaticPathsRequest {
  string session_id = 1;
  string api_key = 2;
  // URL wildcard patterns to match. Empty disables caching.
  repeated string patterns = 3;
  string blob_name = 4;
}

message WaitForAnyRequestRequest {
  string session_id = 1;
  string api_key = 2;
  repeated string patterns = 3;
  // Per-pattern abort flag (1 = block, 0 = observe only). Omit to observe all.
  repeated int32 abort_flags = 4;
  optional double timeout = 5;
}

message WaitForAnyRequestResponse {
  int32 index = 1;
  InterceptedRequest request = 2;
}

message WaitForAnyResponseRequest {
  string session_id = 1;
  string api_key = 2;
  repeated string patterns = 3;
  // Per-pattern abort flag (1 = replace with empty 200, 0 = pass through).
  repeated int32 abort_flags = 4;
  optional double timeout = 5;
}

message WaitForAnyResponseResponse {
  int32 index = 1;
  InterceptedResponse response = 2;
}

message ModifyRequestRequest {
  string session_id = 1;
  string api_key = 2;
  string url_pattern = 3;
  repeated HeaderModification modifications = 4;
  // Override POST/PUT/PATCH body. Empty = no body change.
  optional string body = 5;
  optional double timeout = 6;
}

message ModifyRequestResponse {
  InterceptedRequest request = 1;
}

// ──────────────────────────────────────────────────────────────────────
// Network capture
// ──────────────────────────────────────────────────────────────────────

message StartNetworkCaptureRequest {
  string session_id = 1;
  string api_key = 2;
  // URL wildcards to capture; empty captures everything in the session.
  // Prefix an entry with "!" to exclude it.
  repeated string patterns = 3;
  // Response body capture: "none" (default), "text" or "all".
  string bodies = 4;
  // Narrows body capture further; empty applies `bodies` to every captured
  // exchange.
  repeated string body_patterns = 5;

  // The per-body and per-session byte caps the browser command also accepts
  // are deliberately not on the wire: they bound memory on a host shared by
  // every session on the machine, so one caller must not be able to size
  // another caller's buffers. Reserved in case that ever changes.
  reserved 6, 7;
}

message StopNetworkCaptureRequest {
  string session_id = 1;
  string api_key = 2;
}

message StopNetworkCaptureResponse {
  // False if no capture was running for this session.
  bool stopped = 1;
}

message StreamNetworkExchangesRequest {
  string session_id = 1;
  string api_key = 2;
}

message NetworkExchangeEvent {
  NetworkExchange exchange = 1;
  // Cumulative exchanges dropped for this subscriber because it read slower
  // than the page produced them. Non-zero means the log has holes.
  uint64 dropped = 2;
}

// One request together with the response it received.
//
// A redirect is not a special case: every hop is reported as its own exchange,
// sharing chain_id with its siblings and counting up redirect_index.
message NetworkExchange {
  // Unique per hop.
  string request_id = 1;
  // Shared by every hop of one redirect chain.
  string chain_id = 2;
  // 0 for the original request, incremented once per redirect followed.
  int32 redirect_index = 3;
  // DevTools frame token of the originating frame; empty for workers.
  string frame_id = 4;
  // Whether that frame runs in its own process.
  bool is_oopif = 5;
  // "document" | "subframe" | "script" | "stylesheet" | "image" | "font" |
  // "media" | "fetch" | "worker" | "manifest" | "object" | "csp-report" |
  // "other". fetch(), XMLHttpRequest and EventSource all report "fetch" —
  // they are indistinguishable in the browser process.
  string resource_type = 6;
  string method = 7;
  string url = 8;
  // Origin that initiated the request; empty if browser-initiated.
  string initiator_url = 9;
  repeated Header request_headers = 10;
  // True when request_headers are the bytes actually put on the wire —
  // Cookie, User-Agent, Sec-* and encoding included. False means they are what
  // the renderer asked for, before the network service filled in the rest.
  bool request_headers_are_wire = 11;
  // Inline request body, capped by the browser. File and streamed uploads are
  // not included; request_body_truncated is set when anything was left out.
  bytes request_body = 12;
  bool request_body_truncated = 13;
  // False when the request failed before any response arrived.
  bool has_response = 14;
  int32 status_code = 15;
  string status_text = 16;
  string mime_type = 17;
  // Negotiated ALPN protocol, e.g. "h2" or "http/1.1".
  string protocol = 18;
  string remote_address = 19;
  // "network" | "cache" | "serviceWorker" | "wrcStaticCache" | "wrcSynthetic"
  string served_from = 20;
  repeated Header response_headers = 21;
  bool response_headers_are_wire = 22;
  // Populated only when body capture was requested and applied. Bodies cross
  // the browser boundary as text, so binary content (bodies="all" on an image)
  // does not arrive intact.
  bytes response_body = 23;
  bool response_body_truncated = 24;
  bool response_body_captured = 25;
  int64 encoded_data_length = 26;
  // Net error name (e.g. "net::ERR_ABORTED"); empty on success.
  string error = 27;
}

// ──────────────────────────────────────────────────────────────────────
// Cookies
// ──────────────────────────────────────────────────────────────────────

message GetCookiesRequest {
  string session_id = 1;
  string api_key = 2;
}

message GetCookiesResponse {
  repeated CookieParam cookies = 1;
}

message SetCookiesRequest {
  string session_id = 1;
  string api_key = 2;
  repeated CookieParam cookies = 3;
}

message ClearCookiesRequest {
  string session_id = 1;
  string api_key = 2;
}

// ──────────────────────────────────────────────────────────────────────
// Storage (localStorage)
// ──────────────────────────────────────────────────────────────────────

message StorageItem {
  // localStorage key.
  string key = 1;
  // localStorage value.
  string value = 2;
}

message StorageOriginEntry {
  // Serialized origin, e.g. "https://example.com".
  string origin = 1;
  // Key/value pairs for this origin.
  repeated StorageItem items = 2;
}

message GetStorageRequest {
  string session_id = 1;
  string api_key = 2;
  // If set, only this origin is returned (e.g. "https://example.com").
  // Otherwise all origins with localStorage data are returned.
  optional string origin = 3;
}

message GetStorageResponse {
  // localStorage entries grouped by origin.
  repeated StorageOriginEntry storage = 1;
}

message SetStorageRequest {
  string session_id = 1;
  string api_key = 2;
  // Entries to write, grouped by origin. Accepts the same structure
  // GetStorage returns, so a dump can be fed back verbatim.
  repeated StorageOriginEntry storage = 3;
  // If true, each origin present in `storage` is cleared before writing.
  optional bool clear_first = 4;
}

message ClearStorageRequest {
  string session_id = 1;
  string api_key = 2;
  // If set, only this origin's storage is deleted; otherwise all origins.
  optional string origin = 3;
}

// ──────────────────────────────────────────────────────────────────────
// Auth / DBSC (portable signed-in persona)
// ──────────────────────────────────────────────────────────────────────

// One Device Bound Session Credentials entry (WRC.DbscSession).
message DbscSession {
  // Serialized net::SchemefulSite (eTLD+1 site key), e.g. "https://google.com".
  string site = 1;
  // Base64 of the serialized net.device_bound_sessions.proto.Session
  // (includes the wrapped binding key; portable under WRC's software
  // UnexportableKeyProvider).
  string session = 2;
}

// Portable snapshot of a context's signed-in Google account and/or DBSC
// sessions (WRC.AuthSession). All fields optional so partial state round-trips.
message AuthSession {
  // Gaia obfuscated account id.
  optional string gaia_id = 1;
  // Account email.
  optional string email = 2;
  // OAuth refresh token (persistent).
  optional string refresh_token = 3;
  // Base64 of the wrapped device-binding key for the refresh token.
  // Empty/absent = unbound token.
  optional string wrapped_binding_key = 4;
  // Signin-scoped device id; must travel with the token.
  optional string signin_scoped_device_id = 5;
  // True if the account should be restored at Sync consent.
  optional bool sync_consent = 6;
  // Device Bound Session Credentials for this context (all bound sites).
  repeated DbscSession dbsc_sessions = 7;
}

message GetAuthSessionRequest {
  string session_id = 1;
  string api_key = 2;
}

message GetAuthSessionResponse {
  // Present only if the context has exportable auth/DBSC state.
  optional AuthSession session = 1;
}

message SetAuthSessionRequest {
  string session_id = 1;
  string api_key = 2;
  // Session to import (as returned by GetAuthSession).
  AuthSession session = 3;
}

// ──────────────────────────────────────────────────────────────────────
// DOM / observation
// ──────────────────────────────────────────────────────────────────────

message GetDOMRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  optional string frame_id = 4;
  // -1 = full tree (default), 0 = root only, N = root + N descendant levels.
  optional int32 depth = 5;
}

message GetDOMResponse {
  // JSON string in CDP DOM.Node shape (root is the Document node).
  string dom = 1;
}

message GetObservationRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  // Safety net against runaway documents; max_total_tokens is the limit that
  // normally binds. Default 800.
  optional int32 max_elements_per_frame = 4;
  // Max length of human-readable strings (labels, text, values). Default 300.
  // Identifier-like attributes have their own shorter cap.
  optional int32 max_text_length = 5;
  // "text" (default) for the compact line format, "json" for the structured
  // form. Only the requested representation is built.
  optional string format = 6;
  // Budget across ALL frames, in estimated tokens rather than characters.
  // Default 8000.
  optional int32 max_total_tokens = 7;
  // Include element bounds as bounds="x,y,w,h".
  optional bool include_bounds = 8;
  // Only emit elements intersecting the frame's current viewport.
  optional bool viewport_only = 9;
  // Scope root by backend node ID from a previous wait/getObservation.
  // Requires frame_id. At most one of backend_node_id, selector, js_expression.
  // Omit all three for the whole page.
  optional int32 backend_node_id = 10;
  // Scope root by CSS selector.
  optional string selector = 11;
  // Scope root by JS expression that evaluates to a DOM Element
  // (including __wrc.shadow(...) for closed shadow roots).
  optional string js_expression = 12;
  // Where to look up the scope root: a specific frameId, empty/omitted for
  // the main frame, or "ALL_FRAMES" to search every frame until found.
  // Ignored when observing the whole page.
  optional string frame_id = 13;
}

message GetObservationResponse {
  // The observation in the requested format.
  string observation = 1;

  // Field 2 was observation_json, back when text and JSON were always built
  // together. The format parameter selects one instead.
  reserved 2;
  reserved "observation_json";
}

// ──────────────────────────────────────────────────────────────────────
// DOM hash / inspect / highlight (UI helpers)
// ──────────────────────────────────────────────────────────────────────

// GetDOMHash is a cheap polling endpoint for change-detection. The server
// computes sha256[:8] of the full-tree DOM JSON and returns just that.
message GetDOMHashRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  optional string frame_id = 4;
}

message GetDOMHashResponse {
  string hash = 1;
}

// ──────────────────────────────────────────────────────────────────────
// DOM mirror
// ──────────────────────────────────────────────────────────────────────

message StartDomMirrorRequest {
  string session_id = 1;
  string api_key = 2;
  // Levels to serialize up front. Default 2 (#document -> <html> ->
  // <head>/<body>) — enough to draw a collapsed tree. -1 walks everything and
  // defeats the point of the mirror.
  optional int32 depth = 4;
  // Descend into author shadow roots. Fixed for the life of the mirror.
  optional bool pierce = 5;

  reserved 3;  // was frame_id, before the mirror became page-wide
}

message StartDomMirrorResponse {
  // The MAIN frame's document, CDP DOM.Node-shaped JSON, the same format
  // GetDOM returns.
  //
  // An <iframe> in it reports child_node_count 1 without carrying that child:
  // the document it hosts is fetched with GetDomChildren like any other child
  // list, and asking is also what starts mirroring that frame.
  string root = 1;
  // The page's main frame.
  string frame_id = 2;
  // The page sequence this snapshot is the baseline for. Every DomUpdate after
  // it carries a higher one.
  uint64 seq = 3;

  reserved 4;  // was frames[]; a frame's document is now a child of its owner
}

message StopDomMirrorRequest {
  string session_id = 1;
  string api_key = 2;

  reserved 3;  // was frame_id; the mirror is page-wide
}

message GetDomChildrenRequest {
  string session_id = 1;
  string api_key = 2;
  int32 backend_node_id = 3;
  optional string frame_id = 4;
  // Levels below the node. Default 1.
  optional int32 depth = 5;
}

message GetDomChildrenResponse {
  // JSON array of DOM.Node. Empty for an id this mirror never handed out,
  // which is also what a stale id from before a resync looks like.
  //
  // On an <iframe>/<frame>/<object> the one child is the document it hosts,
  // and this call is what starts mirroring that frame.
  string children = 1;
  // Page sequence this payload is valid as of.
  uint64 seq = 2;
}

message ReleaseDomSubtreeRequest {
  string session_id = 1;
  string api_key = 2;
  int32 backend_node_id = 3;
  optional string frame_id = 4;
}

message RevealDomNodeRequest {
  string session_id = 1;
  string api_key = 2;
  int32 backend_node_id = 3;
  optional string frame_id = 4;
}

message RevealDomNodeResponse {
  // JSON array of DOM.Node, the MAIN document first, each carrying one level
  // of children, crossing into frames at the document nodes along it. A
  // document's frame_id is the id space its own backend_node_id and everything
  // after it counts in. Empty if the node is not on the page.
  string path = 1;
  // Page sequence this payload is valid as of.
  uint64 seq = 2;
}

message GetDomRevisionRequest {
  string session_id = 1;
  string api_key = 2;
  optional string frame_id = 3;
}

message GetDomRevisionResponse {
  // Monotonic counter, meaningful only within the current document.
  uint64 revision = 1;
}

message StreamDomEventsRequest {
  string session_id = 1;
  string api_key = 2;
}

// One batch of edits to the revealed part of the page's DOM.
message DomUpdate {
  // The id space these entries' node ids live in. Node ids restart per frame,
  // so this is half of every address in the batch.
  string frame_id = 1;
  // Page sequence AFTER applying this batch. One clock for the whole page: an
  // edit in an OOPIF and one in the main document are ordered against each
  // other because both passed through the browser in the order it saw them.
  uint64 seq = 2;
  // JSON array of entries, ordered, to be applied in order. See the domUpdate
  // event in WRC.pdl for the entry shapes.
  //
  // A frame's document arriving or being replaced is an edit like any other: a
  // childNodeInserted or childNodeRemoved on the <iframe> that hosts it, both
  // in the same batch when it is a replacement.
  string edits = 3;
}

// The client's copy of the page is void and must be rebuilt by calling
// StartDomMirror again.
//
// Page-wide, because only the MAIN frame can void everything. A child frame
// losing its document is a childNodeRemoved plus a childNodeInserted on its
// owner, which costs that subtree rather than the page. Worth the distinction
// on any page carrying ad frames, where the page-wide version would otherwise
// fire continuously.
message DomResync {
  // "documentReplaced", "overflow", "rendererGone" from the browser, or
  // "slowReader" when this relay could not hold the backlog.
  string reason = 2;

  reserved 1;  // was frame_id; a resync is page-wide
}

// Updates and resyncs share one stream because they are only meaningful
// relative to each other. On two streams a client could apply a batch that the
// resync it has not read yet already invalidated, and no amount of sequence
// bookkeeping recovers that ordering after the fact.
//
// There is deliberately no dropped-message counter, which the network exchange
// stream does have. A dropped exchange leaves a log with a hole in it; a
// dropped edit leaves a TREE THAT IS WRONG, and a client cannot tell the
// difference by looking at it. So a backlog this relay cannot hold is
// converted into a resync instead of being counted.
message DomEvent {
  oneof event {
    DomUpdate update = 1;
    DomResync resync = 2;
  }

  reserved 3, 4;  // were frame_attached / frame_detached
}

message InspectAtPositionRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  // Viewport-relative CSS pixels.
  double x = 4;
  double y = 5;
}

message InspectAtPositionResponse {
  // 0 if nothing was found at (x, y).
  int32 backend_node_id = 1;
  string frame_id = 2;
  string tag_name = 3;
  // Trimmed text content (max ~200 chars, server-imposed).
  string text_content = 4;
  bool is_visible = 5;
  Rect bounds = 6;
}

message HighlightNodeRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  // <= 0 clears all highlights.
  int32 backend_node_id = 4;
  optional string frame_id = 5;
}

// ──────────────────────────────────────────────────────────────────────
// Keyboard / IME / selection
// ──────────────────────────────────────────────────────────────────────

// IME-style text insertion at the current cursor position — no individual
// key events. Targets whatever element currently has focus.
message InsertTextRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  string text = 4;
}

// Type dispatches `text` as a per-key stream of real keyboard events to the
// currently focused element (untargeted, no focus pinning) — unlike InsertText,
// which is a single IME-style commit. Focus may move between fields mid-stream
// (e.g. OTP inputs that auto-advance on each digit). For a strict, target-bound
// value that must stay focused, use Fill instead.
message TypeRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  string text = 4;
  // Clear the currently focused field first (Ctrl+A, Delete). Default false.
  optional bool clear_first = 5;
}

// Fires a single key-down (PressKey) or key-up (ReleaseKey) event. For
// full press cycles (down + char + up) call PressKey followed by ReleaseKey,
// or use one of the higher-level typing helpers in the SDK.
message PressKeyRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  // DOM key value (e.g. "a", "Enter", "ArrowDown", "Shift").
  string key = 4;
  // DOM code value (e.g. "KeyA", "Enter", "ArrowDown", "ShiftLeft").
  optional string code = 5;
  // Bit flags: Alt=1, Ctrl=2, Meta=4, Shift=8.
  optional int32 modifiers = 6;
  // DOM KeyboardEvent.location (0=standard, 1=left, 2=right, 3=numpad).
  optional int32 location = 7;
}

message ReleaseKeyRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  string key = 4;
  optional string code = 5;
  optional int32 modifiers = 6;
  optional int32 location = 7;
}

message GetSelectionRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
}

message GetSelectionResponse {
  // Empty if nothing is selected on the page.
  string text = 1;
}

// ──────────────────────────────────────────────────────────────────────
// Screenshot / capture
// ──────────────────────────────────────────────────────────────────────

// Screenshot captures a single image of the page's current frame. The server
// uses a one-shot surface copy (the same mechanism as CDP
// Page.captureScreenshot), independent of any active WRC.startStream video
// stream, and works with both GPU (hardware) and software compositing.
message ScreenshotRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;
  // Image format: "png" (default), "jpeg", or "webp".
  optional string format = 4;
  // Encode quality 0-100 for "jpeg"/"webp" (ignored for "png"). Default 90.
  optional int32 quality = 5;
}

message ScreenshotResponse {
  // Encoded image bytes as base64 (PNG by default).
  string data_base64 = 1;
  // Image width in physical pixels.
  int32 width = 2;
  // Image height in physical pixels.
  int32 height = 3;
}

// ReadCanvas reads the pixels of a <canvas> directly in the renderer, bypassing
// the origin-clean (tainted) security check and without executing page JS.
// Cross-origin/tainted canvases read fine. Targeted like click: by
// backendNodeId (preferred), CSS selector, or JS expression.
message ReadCanvasRequest {
  string session_id = 1;
  string api_key = 2;
  string page_id = 3;

  optional int32 backend_node_id = 4;
  optional string selector = 5;
  optional string js_expression = 6;
  optional string frame_id = 7;

  // Output format: "png" (default), "jpeg", "webp", or "rgba" for the raw
  // unencoded RGBA pixel buffer.
  optional string format = 8;
  // Encode quality 0-100 for "jpeg"/"webp" (ignored otherwise). Default 90.
  optional int32 quality = 9;
  // Optional sub-rectangle in canvas pixels (mirrors getImageData(sx,sy,sw,sh)).
  // Omit sw/sh (or set <= 0) to read the full canvas.
  optional int32 sx = 10;
  optional int32 sy = 11;
  optional int32 sw = 12;
  optional int32 sh = 13;
}

message ReadCanvasResponse {
  // Whether a <canvas> was found and read.
  bool success = 1;
  // The frameId that contained the canvas.
  string frame_id = 2;
  // Backend node ID of the canvas that was read.
  int32 backend_node_id = 3;
  // Encoded image bytes as base64 (png/jpeg/webp), or the raw RGBA buffer as
  // base64 when format is "rgba".
  string data_base64 = 4;
  // Pixel width of the returned image (canvas width, or sw if clipped).
  int32 width = 5;
  // Pixel height of the returned image (canvas height, or sh if clipped).
  int32 height = 6;
  // Whether the canvas was actually origin-clean. Informational only.
  bool origin_clean = 7;
}

// ──────────────────────────────────────────────────────────────────────
// Captcha solver
// ──────────────────────────────────────────────────────────────────────

message SolveCaptchaRequest {
  string session_id = 1;
  string api_key = 2;
  // Total time budget in ms. 0 = server default (60s).
  int32 timeout_ms = 3;
  // Retry the solve flow this many times before giving up.
  int32 retry_amount = 4;
}

message SolveCaptchaResponse {
  // Solution token returned by the underlying challenge, when applicable.
  // Empty on success — most challenges are completed in-page server-side
  // and require no further action from the caller. Empty on failure too.
  string result = 1;
}

// ──────────────────────────────────────────────────────────────────────
// Live streaming (WebRTC)
// ──────────────────────────────────────────────────────────────────────

// IceServer is one entry for an RTCPeerConnection's iceServers config: a TURN
// (or STUN) URL plus the short-lived REST credentials to authenticate with it.
message IceServer {
  repeated string urls = 1;
  optional string username = 2;
  optional string credential = 3;
}

message GetStreamConfigRequest {
  string session_id = 1;
  string api_key = 2;
}

message GetStreamConfigResponse {
  // TURN/STUN servers with short-lived credentials. Put these in the client's
  // RTCPeerConnection config BEFORE creating the offer, so it can gather relay
  // candidates.
  repeated IceServer ice_servers = 1;
}

message StartStreamRequest {
  string session_id = 1;
  string api_key = 2;
  // The client's SDP offer. The browser sets it as the remote description and
  // returns its answer. Relay policy, frame rate and bitrate are decided by the
  // server — the client only offers.
  string offer_sdp = 3;
}

message StartStreamResponse {
  // The browser's SDP answer to set as the client's remote description.
  string answer_sdp = 1;
  // Root-viewport size in CSS pixels — the coordinate space the input data
  // channels expect. Delivered with the answer so the client can map pointer
  // coordinates from the first frame on, without a getPages() round trip that
  // races the stream. x/y are always 0. Later changes arrive as
  // {"type":"viewport","width":W,"height":H} on the reliable "input" channel.
  Rect viewport = 2;
}

message StopStreamRequest {
  string session_id = 1;
  string api_key = 2;
}

message StopStreamResponse {}

// ──────────────────────────────────────────────────────────────────────
// Scripts
// ──────────────────────────────────────────────────────────────────────

// One console line a script printed.
message ScriptLogEntry {
  // "info", "warning" or "error", from console.log / .warn / .error.
  string level = 1;
  // The arguments, already stringified the way console does it.
  string message = 2;
  // Unix milliseconds, stamped where the script printed rather than where the
  // line was received, so the log stays ordered across a reconnect.
  int64 timestamp = 3;
}

message RunScriptRequest {
  string session_id = 1;
  string api_key = 2;
  // JavaScript source. Runs with `browser` bound to the session, so the script
  // needs no setup of its own.
  string source = 3;
}

// There is deliberately no timeout on RunScript. A deadline is only useful if
// it can cancel, and cancelling needs the run id — which this call does not
// learn until the reply it is waiting for. A caller who needs a bound uses
// StartScript, which hands the id over first, and StopScripts when the bound is
// hit. A caller who just wants out can StopScripts with no id.
message RunScriptResponse {
  bool success = 1;
  // The script's return value as JSON, "undefined" when it returned nothing,
  // or the error message when success is false.
  string result = 2;
  // The run's id. Arrives too late to follow the run, but names it for a caller
  // that wants to match up log lines it already saw on the stream.
  string run_id = 3;
  // Everything the script logged, in order — whether or not anyone subscribed.
  repeated ScriptLogEntry log = 4;
  // True when the script printed more than the reply holds, in which case log
  // is the tail of the output rather than all of it.
  bool truncated = 5;
}

message StartScriptRequest {
  string session_id = 1;
  string api_key = 2;
  string source = 3;
}

message StartScriptResponse {
  // Identifies the run for StopScripts, ListScriptRuns and the event stream.
  string run_id = 1;
}

message StopScriptsRequest {
  string session_id = 1;
  string api_key = 2;
  // The run to cancel. Empty cancels every run in this session — the
  // distinction is deliberately explicit, because there is no undo for either.
  string run_id = 3;
}

message StopScriptsResponse {
  int32 stopped = 1;
}

message ScriptRun {
  string run_id = 1;
  // How long the run has been going, in ms. Reported as an age rather than a
  // start time because that is what the browser knows — it counts from when the
  // run was accepted, with no clock shared with the caller.
  int64 running_ms = 2;
}

message ListScriptRunsRequest {
  string session_id = 1;
  string api_key = 2;
}

message ListScriptRunsResponse {
  // Only runs still executing. A finished run is reported once on the event
  // stream and then forgotten; this is not a history.
  repeated ScriptRun runs = 1;
}

message StreamScriptEventsRequest {
  string session_id = 1;
  string api_key = 2;
  // Report only this run. Empty reports every run in the session, which is what
  // a dashboard wants and what a single follower does not.
  string run_id = 3;
}

message ScriptLog {
  string run_id = 1;
  ScriptLogEntry line = 2;
}

message ScriptFinished {
  string run_id = 1;
  bool success = 2;
  // The return value as JSON, or the error message when success is false — the
  // same one field as in RunScriptResponse.
  string result = 3;
  // True when the run ended because StopScripts cancelled it, or because the VM
  // was torn down under it, rather than on its own.
  bool stopped = 4;
}

message ScriptEvent {
  oneof event {
    ScriptLog log = 1;
    ScriptFinished finished = 2;
  }
  // Cumulative events dropped for this subscriber because it read slower than
  // the scripts produced them. Non-zero means the log has holes.
  uint64 dropped = 3;
}

