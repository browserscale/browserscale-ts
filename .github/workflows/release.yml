name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # npm trusted publishing: the registry accepts this run's OIDC identity in
  # place of a token, and signs provenance against it.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # npm publishes whatever package.json says, so a tag that disagrees with
      # it would put one version on GitHub and another on npm.
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships older.
      - name: Update npm
        run: npm install -g npm@latest

      # A version that is already on the registry is skipped, so a rerun, or a
      # release published by hand, finishes instead of failing. The build ran
      # above, so prepublishOnly is not needed a second time.
      - name: Publish to npm
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, skipping"
          else
            npm publish --access public --provenance --ignore-scripts
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
